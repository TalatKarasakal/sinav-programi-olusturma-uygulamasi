plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.0.1'
    id 'jacoco'
}

group = 'com.scheduler'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = "21"
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.47.0.0'
    // sqlite-jdbc's module-info requires org.slf4j; NOP binding silences its logging
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'
    implementation 'org.controlsfx:controlsfx:11.1.2'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'com.github.librepdf:openpdf:1.3.40'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.testfx:testfx-core:4.0.18'
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'org.hamcrest:hamcrest:2.2'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    // Headless mode: TestFX with Xvfb when DISPLAY is set
    def display = System.getenv('DISPLAY') ?: ':99'
    environment 'DISPLAY', display
    systemProperty 'display.available', System.getenv('DISPLAY') != null ? 'true' : 'false'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

application {
    mainClass = 'scheduler.ui.Launcher'
    mainModule = 'scheduler'
    applicationDefaultJvmArgs = ['-Dglass.disableGrab=true']
}

jlink {
    // log4j-api 2.21.1 has a module descriptor that omits org.apache.logging.log4j.util.internal
    // from its declared package set — jlink rejects this mismatch. Force-merge bypasses the
    // strict named-module check; the plugin patches dependent delegating module-infos.
    forceMerge 'log4j'

    launcher {
        name = 'ExamScheduler'
    }

    jpackage {
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            installerType = 'msi'
            installerOptions = [
                '--win-dir-chooser',
                '--win-menu',
                '--win-shortcut',
                '--vendor', 'Talat Karasakal',
            ]
            // imageOptions = ['--icon', 'src/main/resources/icon.ico']
        }
        if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            installerType = 'dmg'
            installerOptions = [
                '--mac-package-name', 'ExamScheduler',
                '--vendor', 'Talat Karasakal',
            ]
            // imageOptions = ['--icon', 'src/main/resources/icon.icns']
        }
        if (org.gradle.internal.os.OperatingSystem.current().isLinux()) {
            installerType = 'deb'
            installerOptions = [
                '--linux-shortcut',
                '--linux-menu-group', 'Education',
                '--vendor', 'Talat Karasakal',
            ]
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'test/**'
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}
